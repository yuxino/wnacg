name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Verify app and tag versions
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const packageVersion = require("./package.json").version;
            const tauriVersion = JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json", "utf8")).version;
            const cargoVersion = fs.readFileSync("src-tauri/Cargo.toml", "utf8").match(/^version\s*=\s*"([^"]+)"/m)?.[1];
            const versions = { packageVersion, tauriVersion, cargoVersion };
            if (new Set(Object.values(versions)).size !== 1) {
              throw new Error(`App versions do not match: ${JSON.stringify(versions)}`);
            }
            if (process.env.GITHUB_REF_TYPE === "tag" && process.env.GITHUB_REF_NAME !== `v${packageVersion}`) {
              throw new Error(`Tag ${process.env.GITHUB_REF_NAME} must match v${packageVersion}`);
            }
          '

  quality:
    needs: verify-version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
            src-tauri/ocr/manga_helper -> target

      - name: Install dependencies
        run: npm ci

      - name: Audit JavaScript dependencies
        run: npm audit --audit-level=high

      - name: Check frontend
        run: npm run build

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Lint Rust
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked -- -D warnings

      - name: Test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Check locked manga OCR helper
        run: cargo check --manifest-path src-tauri/ocr/manga_helper/Cargo.toml --locked

      - name: Build Tauri (macOS)
        run: npm run tauri build -- --ci --config '{"build":{"beforeBuildCommand":null}}'

      - name: Upload DMG
        uses: actions/upload-artifact@v7.0.1
        with:
          name: macos-dmg
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  build-windows:
    needs: verify-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
            src-tauri/ocr/manga_helper -> target

      - name: Install dependencies
        run: npm ci

      - name: Check locked manga OCR helper (Windows)
        run: cargo check --manifest-path src-tauri/ocr/manga_helper/Cargo.toml --locked

      - name: Build Tauri (Windows)
        run: npm run tauri build

      - name: Upload MSI
        uses: actions/upload-artifact@v7.0.1
        with:
          name: windows-msi
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: Upload NSIS
        uses: actions/upload-artifact@v7.0.1
        with:
          name: windows-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  create-release:
    needs: [quality, build-windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: '*'
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v3.0.2
        with:
          files: |
            *.msi
            *.exe
            *.dmg
          fail_on_unmatched_files: true
