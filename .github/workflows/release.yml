name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

jobs:
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Verify app and tag versions
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const packageVersion = require("./package.json").version;
            const tauriVersion = JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json", "utf8")).version;
            const cargoVersion = fs.readFileSync("src-tauri/Cargo.toml", "utf8").match(/^version\s*=\s*"([^"]+)"/m)?.[1];
            const versions = { packageVersion, tauriVersion, cargoVersion };
            if (new Set(Object.values(versions)).size !== 1) {
              throw new Error(`App versions do not match: ${JSON.stringify(versions)}`);
            }
            if (process.env.GITHUB_REF_TYPE === "tag" && process.env.GITHUB_REF_NAME !== `v${packageVersion}`) {
              throw new Error(`Tag ${process.env.GITHUB_REF_NAME} must match v${packageVersion}`);
            }
          '

  quality:
    needs: verify-version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
            src-tauri/ocr/manga_helper -> target

      - name: Install dependencies
        run: npm ci

      - name: Audit JavaScript dependencies
        run: npm audit --audit-level=high

      - name: Check frontend
        run: npm run build

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Lint Rust
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked -- -D warnings

      - name: Test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Check locked manga OCR helper
        run: cargo check --manifest-path src-tauri/ocr/manga_helper/Cargo.toml --locked

      - name: Build Tauri (macOS)
        env:
          APPLE_SIGNING_IDENTITY: '-'
        run: npm run tauri build -- --ci --config '{"build":{"beforeBuildCommand":null}}'

      - name: Verify macOS arm64 release asset
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          verify_arm64_app() {
            local bundle="$1"
            local executable_name executable architectures
            executable_name="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$bundle/Contents/Info.plist")"
            executable="$bundle/Contents/MacOS/$executable_name"
            [[ -f "$executable" ]] || { echo "app executable is missing: $executable" >&2; exit 1; }
            architectures="$(lipo -archs "$executable")"
            [[ "$architectures" == "arm64" ]] || {
              echo "expected arm64-only app executable, found: $architectures" >&2
              exit 1
            }
          }

          app="src-tauri/target/release/bundle/macos/wnacg.app"
          dmgs=(src-tauri/target/release/bundle/dmg/*.dmg)
          [[ -d "$app" ]] || { echo "macOS app bundle is missing" >&2; exit 1; }
          [[ ${#dmgs[@]} -eq 1 ]] || { echo "expected exactly one DMG, found ${#dmgs[@]}" >&2; exit 1; }
          [[ "$(basename "${dmgs[0]}")" == *_aarch64.dmg ]] || {
            echo "expected an aarch64 DMG, found: $(basename "${dmgs[0]}")" >&2
            exit 1
          }

          verify_arm64_app "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          hdiutil verify "${dmgs[0]}"

          mount_dir="$(mktemp -d)"
          hdiutil attach -readonly -nobrowse -mountpoint "$mount_dir" "${dmgs[0]}" >/dev/null
          trap 'hdiutil detach "$mount_dir" >/dev/null' EXIT

          packaged_app="$mount_dir/wnacg.app"
          [[ -d "$packaged_app" ]] || { echo "DMG does not contain wnacg.app" >&2; exit 1; }
          verify_arm64_app "$packaged_app"
          codesign --verify --deep --strict --verbose=2 "$packaged_app"

      - name: Upload DMG
        uses: actions/upload-artifact@v7.0.1
        with:
          name: macos-dmg
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  build-windows:
    needs: verify-version
    name: Windows Server 2025 x64 build and smoke
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
            src-tauri/ocr/manga_helper -> target

      - name: Install dependencies
        run: npm ci

      - name: Check locked manga OCR helper (Windows)
        run: cargo check --manifest-path src-tauri/ocr/manga_helper/Cargo.toml --locked

      - name: Build Tauri (Windows)
        run: npm run tauri build

      - name: Run x64 install and startup smoke with Windows PowerShell 5.1
        shell: powershell
        run: .\scripts\windows-smoke.ps1 -ArtifactRoot 'src-tauri/target/release' -ExpectedRunnerArchitecture X64

      - name: Upload MSI
        uses: actions/upload-artifact@v7.0.1
        with:
          name: windows-msi
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: Upload NSIS
        uses: actions/upload-artifact@v7.0.1
        with:
          name: windows-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  smoke-windows-arm64:
    name: Windows 11 ARM64 x64-emulation smoke
    needs: build-windows
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Download MSI
        uses: actions/download-artifact@v8.0.1
        with:
          name: windows-msi
          path: artifacts/msi

      - name: Download NSIS
        uses: actions/download-artifact@v8.0.1
        with:
          name: windows-nsis
          path: artifacts/nsis

      - name: Run install and startup smoke with Windows PowerShell 5.1
        shell: powershell
        run: .\scripts\windows-smoke.ps1 -ArtifactRoot 'artifacts' -ExpectedRunnerArchitecture ARM64 -SkipPortableProbe

  create-release:
    needs: [quality, build-windows, smoke-windows-arm64]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: '*'
          merge-multiple: true

      - name: Generate and verify SHA-256 manifest
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t assets < <(
            find . -maxdepth 1 -type f \( -name '*.msi' -o -name '*.exe' -o -name '*.dmg' \) \
              -print | sed 's#^./##' | LC_ALL=C sort
          )
          [[ ${#assets[@]} -eq 3 ]] || {
            echo "expected exactly three release assets, found ${#assets[@]}" >&2
            exit 1
          }
          sha256sum "${assets[@]}" > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@v3.0.2
        with:
          files: |
            *.msi
            *.exe
            *.dmg
            SHA256SUMS.txt
          fail_on_unmatched_files: true
