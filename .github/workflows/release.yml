name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

jobs:
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Verify app and tag versions
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const packageVersion = require("./package.json").version;
            const tauriVersion = JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json", "utf8")).version;
            const cargoVersion = fs.readFileSync("src-tauri/Cargo.toml", "utf8").match(/^version\s*=\s*"([^"]+)"/m)?.[1];
            const versions = { packageVersion, tauriVersion, cargoVersion };
            if (new Set(Object.values(versions)).size !== 1) {
              throw new Error(`App versions do not match: ${JSON.stringify(versions)}`);
            }
            if (process.env.GITHUB_REF_TYPE === "tag" && process.env.GITHUB_REF_NAME !== `v${packageVersion}`) {
              throw new Error(`Tag ${process.env.GITHUB_REF_NAME} must match v${packageVersion}`);
            }
          '

  release-preflight:
    needs: verify-version
    runs-on: ubuntu-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - name: Enforce updater signing before tags
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            exit 0
          fi
          [[ -n "$TAURI_SIGNING_PRIVATE_KEY" ]] || { echo "missing updater signing key" >&2; exit 1; }
          [[ -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ]] || { echo "missing updater signing password" >&2; exit 1; }

  quality:
    needs: [verify-version, release-preflight]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
            src-tauri/ocr/manga_helper -> target

      - name: Install dependencies
        run: npm ci

      - name: Audit JavaScript dependencies
        run: npm audit --audit-level=high

      - name: Check frontend
        run: npm run build

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Lint Rust
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked -- -D warnings

      - name: Test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Check locked manga OCR helper
        run: cargo check --manifest-path src-tauri/ocr/manga_helper/Cargo.toml --locked

      - name: Build Tauri (macOS)
        env:
          APPLE_SIGNING_IDENTITY: '-'
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$TAURI_SIGNING_PRIVATE_KEY" ]]; then
            npm run tauri build -- --ci --config '{"build":{"beforeBuildCommand":null}}'
          else
            npm run tauri build -- --ci --config '{"build":{"beforeBuildCommand":null},"bundle":{"createUpdaterArtifacts":false}}'
          fi

      - name: Verify macOS arm64 release asset
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          verify_arm64_app() {
            local bundle="$1"
            local executable_name executable architectures
            executable_name="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$bundle/Contents/Info.plist")"
            executable="$bundle/Contents/MacOS/$executable_name"
            [[ -f "$executable" ]] || { echo "app executable is missing: $executable" >&2; exit 1; }
            architectures="$(lipo -archs "$executable")"
            [[ "$architectures" == "arm64" ]] || {
              echo "expected arm64-only app executable, found: $architectures" >&2
              exit 1
            }
          }

          app="src-tauri/target/release/bundle/macos/wnacg.app"
          dmgs=(src-tauri/target/release/bundle/dmg/*.dmg)
          [[ -d "$app" ]] || { echo "macOS app bundle is missing" >&2; exit 1; }
          [[ ${#dmgs[@]} -eq 1 ]] || { echo "expected exactly one DMG, found ${#dmgs[@]}" >&2; exit 1; }
          [[ "$(basename "${dmgs[0]}")" == *_aarch64.dmg ]] || {
            echo "expected an aarch64 DMG, found: $(basename "${dmgs[0]}")" >&2
            exit 1
          }

          verify_arm64_app "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          hdiutil verify "${dmgs[0]}"

          mount_dir="$(mktemp -d)"
          hdiutil attach -readonly -nobrowse -mountpoint "$mount_dir" "${dmgs[0]}" >/dev/null
          trap 'hdiutil detach "$mount_dir" >/dev/null' EXIT

          packaged_app="$mount_dir/wnacg.app"
          [[ -d "$packaged_app" ]] || { echo "DMG does not contain wnacg.app" >&2; exit 1; }
          verify_arm64_app "$packaged_app"
          codesign --verify --deep --strict --verbose=2 "$packaged_app"

      - name: Upload macOS release assets
        uses: actions/upload-artifact@v7.0.1
        with:
          name: macos-release
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: error

  build-windows:
    needs: [verify-version, release-preflight]
    name: Windows Server 2025 x64 build and smoke
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
            src-tauri/ocr/manga_helper -> target

      - name: Install dependencies
        run: npm ci

      - name: Check locked manga OCR helper (Windows)
        run: cargo check --manifest-path src-tauri/ocr/manga_helper/Cargo.toml --locked

      - name: Build Tauri (Windows)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: powershell
        run: |
          if ($env:TAURI_SIGNING_PRIVATE_KEY) {
            npm run tauri build
          } else {
            npm run tauri build -- --config '{"bundle":{"createUpdaterArtifacts":false}}'
          }

      - name: Run x64 install and startup smoke with Windows PowerShell 5.1
        shell: powershell
        run: .\scripts\windows-smoke.ps1 -ArtifactRoot 'src-tauri/target/release' -ExpectedRunnerArchitecture X64

      - name: Upload MSI
        uses: actions/upload-artifact@v7.0.1
        with:
          name: windows-msi
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.msi.sig
          if-no-files-found: error

      - name: Upload NSIS
        uses: actions/upload-artifact@v7.0.1
        with:
          name: windows-nsis
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
          if-no-files-found: error

  smoke-windows-arm64:
    name: Windows 11 ARM64 x64-emulation smoke
    needs: build-windows
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Download MSI
        uses: actions/download-artifact@v8.0.1
        with:
          name: windows-msi
          path: artifacts/msi

      - name: Download NSIS
        uses: actions/download-artifact@v8.0.1
        with:
          name: windows-nsis
          path: artifacts/nsis

      - name: Run install and startup smoke with Windows PowerShell 5.1
        shell: powershell
        run: .\scripts\windows-smoke.ps1 -ArtifactRoot 'artifacts' -ExpectedRunnerArchitecture ARM64 -SkipPortableProbe

  create-release:
    needs: [quality, build-windows, smoke-windows-arm64]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: '*'
          merge-multiple: true
          path: artifacts

      - name: Stage and verify signed updater artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-assets

          mapfile -t release_files < <(
            find artifacts -type f \( \
              -name '*.msi' -o -name '*.exe' -o -name '*.dmg' -o -name '*.app.tar.gz' -o -name '*.sig' \
            \) -print | LC_ALL=C sort
          )
          [[ ${#release_files[@]} -eq 7 ]] || {
            echo "expected exactly seven built release assets, found ${#release_files[@]}" >&2
            exit 1
          }
          for source in "${release_files[@]}"; do
            destination="release-assets/$(basename "$source")"
            [[ ! -e "$destination" ]] || { echo "duplicate release filename: $destination" >&2; exit 1; }
            cp "$source" "$destination"
          done

          shopt -s nullglob

          version="$(node -p 'require("./package.json").version')"
          notes_file="docs/release-notes/v${version}.md"
          mac_bundles=(release-assets/*.app.tar.gz)
          mac_signatures=(release-assets/*.app.tar.gz.sig)
          windows_bundles=(release-assets/*_x64-setup.exe)
          windows_signatures=(release-assets/*_x64-setup.exe.sig)
          [[ -f "$notes_file" ]] || { echo "missing release notes: $notes_file" >&2; exit 1; }
          [[ ${#mac_bundles[@]} -eq 1 ]] || { echo "expected one macOS updater bundle" >&2; exit 1; }
          [[ ${#mac_signatures[@]} -eq 1 ]] || { echo "expected one macOS updater signature" >&2; exit 1; }
          [[ ${#windows_bundles[@]} -eq 1 ]] || { echo "expected one Windows updater bundle" >&2; exit 1; }
          [[ ${#windows_signatures[@]} -eq 1 ]] || { echo "expected one Windows updater signature" >&2; exit 1; }

          export UPDATER_VERSION="$version"
          export UPDATER_REPOSITORY="$GITHUB_REPOSITORY"
          export UPDATER_NOTES_FILE="$notes_file"
          export UPDATER_PUB_DATE="$(git show -s --format=%cI "$GITHUB_SHA")"
          export UPDATER_MAC_BUNDLE="${mac_bundles[0]}"
          export UPDATER_MAC_SIGNATURE="${mac_signatures[0]}"
          export UPDATER_WINDOWS_BUNDLE="${windows_bundles[0]}"
          export UPDATER_WINDOWS_SIGNATURE="${windows_signatures[0]}"
          export UPDATER_OUTPUT="release-assets/latest.json"
          export UPDATER_ASSET_REPORT="release-assets/updater-assets.json"
          node scripts/updater-manifest.mjs
          UPDATER_MODE=verify node scripts/updater-manifest.mjs

      - name: Generate and verify SHA-256 manifest
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t assets < <(
            find release-assets -maxdepth 1 -type f \( \
              -name '*.msi' -o -name '*.exe' -o -name '*.dmg' -o -name '*.app.tar.gz' \
              -o -name '*.sig' -o -name 'latest.json' -o -name 'updater-assets.json' \
            \) \
              -print | sed 's#^release-assets/##' | LC_ALL=C sort
          )
          [[ ${#assets[@]} -eq 9 ]] || {
            echo "expected exactly nine release assets, found ${#assets[@]}" >&2
            exit 1
          }
          (cd release-assets && sha256sum "${assets[@]}" > SHA256SUMS.txt)
          (cd release-assets && sha256sum --check SHA256SUMS.txt)

      - name: Create private source Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes-file "docs/release-notes/v${version}.md" \
            --verify-tag \
            release-assets/*.msi release-assets/*.exe release-assets/*.dmg \
            release-assets/*.app.tar.gz release-assets/*.sig \
            release-assets/latest.json release-assets/updater-assets.json release-assets/SHA256SUMS.txt

      - name: Verify private Release metadata and exact assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          audit_dir="$(mktemp -d)"
          trap 'rm -rf "$audit_dir"' EXIT
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir "$audit_dir"
          cp release-assets/SHA256SUMS.txt "$audit_dir/SHA256SUMS.txt"
          (cd "$audit_dir" && sha256sum --check SHA256SUMS.txt)
          cmp release-assets/latest.json "$audit_dir/latest.json"
