name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Verify app and tag versions
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const packageVersion = require("./package.json").version;
            const tauriVersion = JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json", "utf8")).version;
            const cargoVersion = fs.readFileSync("src-tauri/Cargo.toml", "utf8").match(/^version\s*=\s*"([^"]+)"/m)?.[1];
            const versions = { packageVersion, tauriVersion, cargoVersion };
            if (new Set(Object.values(versions)).size !== 1) {
              throw new Error(`App versions do not match: ${JSON.stringify(versions)}`);
            }
            if (process.env.GITHUB_REF_TYPE === "tag" && process.env.GITHUB_REF_NAME !== `v${packageVersion}`) {
              throw new Error(`Tag ${process.env.GITHUB_REF_NAME} must match v${packageVersion}`);
            }
          '

  quality:
    needs: verify-version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
            src-tauri/ocr/manga_helper -> target

      - name: Install dependencies
        run: npm ci

      - name: Audit JavaScript dependencies
        run: npm audit --audit-level=high

      - name: Check frontend
        run: npm run build

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Lint Rust
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked -- -D warnings

      - name: Test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Check locked manga OCR helper
        run: cargo check --manifest-path src-tauri/ocr/manga_helper/Cargo.toml --locked

      - name: Build Tauri (macOS)
        env:
          APPLE_SIGNING_IDENTITY: '-'
        run: npm run tauri build -- --ci --config '{"build":{"beforeBuildCommand":null}}'

      - name: Verify macOS arm64 release asset
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          verify_arm64_app() {
            local bundle="$1"
            local executable_name executable architectures
            executable_name="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$bundle/Contents/Info.plist")"
            executable="$bundle/Contents/MacOS/$executable_name"
            [[ -f "$executable" ]] || { echo "app executable is missing: $executable" >&2; exit 1; }
            architectures="$(lipo -archs "$executable")"
            [[ "$architectures" == "arm64" ]] || {
              echo "expected arm64-only app executable, found: $architectures" >&2
              exit 1
            }
          }

          app="src-tauri/target/release/bundle/macos/wnacg.app"
          dmgs=(src-tauri/target/release/bundle/dmg/*.dmg)
          [[ -d "$app" ]] || { echo "macOS app bundle is missing" >&2; exit 1; }
          [[ ${#dmgs[@]} -eq 1 ]] || { echo "expected exactly one DMG, found ${#dmgs[@]}" >&2; exit 1; }
          [[ "$(basename "${dmgs[0]}")" == *_aarch64.dmg ]] || {
            echo "expected an aarch64 DMG, found: $(basename "${dmgs[0]}")" >&2
            exit 1
          }

          verify_arm64_app "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          hdiutil verify "${dmgs[0]}"

          mount_dir="$(mktemp -d)"
          hdiutil attach -readonly -nobrowse -mountpoint "$mount_dir" "${dmgs[0]}" >/dev/null
          trap 'hdiutil detach "$mount_dir" >/dev/null' EXIT

          packaged_app="$mount_dir/wnacg.app"
          [[ -d "$packaged_app" ]] || { echo "DMG does not contain wnacg.app" >&2; exit 1; }
          verify_arm64_app "$packaged_app"
          codesign --verify --deep --strict --verbose=2 "$packaged_app"

      - name: Upload DMG
        uses: actions/upload-artifact@v7.0.1
        with:
          name: macos-dmg
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  build-windows:
    needs: verify-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
            src-tauri/ocr/manga_helper -> target

      - name: Install dependencies
        run: npm ci

      - name: Check locked manga OCR helper (Windows)
        run: cargo check --manifest-path src-tauri/ocr/manga_helper/Cargo.toml --locked

      - name: Build Tauri (Windows)
        run: npm run tauri build

      - name: Verify Windows x64 release assets
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          $app = Get-Item 'src-tauri/target/release/wnacg.exe' -ErrorAction Stop
          $msis = @(Get-ChildItem 'src-tauri/target/release/bundle/msi/*.msi' -File)
          $nsisInstallers = @(Get-ChildItem 'src-tauri/target/release/bundle/nsis/*.exe' -File)

          if ($msis.Count -ne 1) {
            throw "Expected exactly one MSI, found $($msis.Count)"
          }
          if ($nsisInstallers.Count -ne 1) {
            throw "Expected exactly one NSIS installer, found $($nsisInstallers.Count)"
          }
          if ($msis[0].Name -notmatch '_x64(?:_.+)?\.msi$') {
            throw "Expected an x64 MSI, found $($msis[0].Name)"
          }
          if ($nsisInstallers[0].Name -notmatch '_x64-setup\.exe$') {
            throw "Expected an x64 NSIS installer, found $($nsisInstallers[0].Name)"
          }

          $installer = $null
          $summary = $null
          try {
            $installer = New-Object -ComObject WindowsInstaller.Installer
            [object[]] $summaryArgs = @([string] $msis[0].FullName, [int] 0)
            $summary = $installer.GetType().InvokeMember(
              'SummaryInformation',
              [System.Reflection.BindingFlags]::GetProperty,
              $null,
              $installer,
              $summaryArgs
            )
            [object[]] $propertyArgs = @([int] 7)
            [string] $template = $summary.GetType().InvokeMember(
              'Property',
              [System.Reflection.BindingFlags]::GetProperty,
              $null,
              $summary,
              $propertyArgs
            )
            if ($template -notmatch '^x64;') {
              throw "MSI Template Summary must target x64, found '$template'"
            }
          } finally {
            if ($null -ne $summary -and [Runtime.InteropServices.Marshal]::IsComObject($summary)) {
              [void] [Runtime.InteropServices.Marshal]::FinalReleaseComObject($summary)
            }
            if ($null -ne $installer -and [Runtime.InteropServices.Marshal]::IsComObject($installer)) {
              [void] [Runtime.InteropServices.Marshal]::FinalReleaseComObject($installer)
            }
          }

          $stream = [System.IO.File]::OpenRead($app.FullName)
          $reader = $null
          try {
            $reader = [System.IO.BinaryReader]::new($stream)
            if ($reader.ReadUInt16() -ne 0x5A4D) {
              throw "$($app.Name) is not a PE executable"
            }
            $stream.Position = 0x3C
            $peOffset = $reader.ReadInt32()
            if ($peOffset -lt 0x40 -or $peOffset -gt ($stream.Length - 6)) {
              throw "$($app.Name) has an invalid PE header offset"
            }
            $stream.Position = $peOffset
            if ($reader.ReadUInt32() -ne 0x00004550) {
              throw "$($app.Name) has an invalid PE signature"
            }
            $machine = $reader.ReadUInt16()
          } finally {
            if ($null -ne $reader) {
              $reader.Dispose()
            } else {
              $stream.Dispose()
            }
          }

          if ($machine -ne 0x8664) {
            throw ('Expected an x64 app executable (PE machine 0x8664), found 0x{0:X4}' -f $machine)
          }

          $ocrResourceDir = 'src-tauri/target/release/ocr'
          $ocrFiles = @(
            'manga_ocr_helper.exe',
            'onnxruntime.dll',
            'onnxruntime_providers_shared.dll',
            'MSVCP140.dll',
            'MSVCP140_1.dll',
            'VCRUNTIME140.dll',
            'VCRUNTIME140_1.dll'
          )
          foreach ($name in $ocrFiles) {
            $file = Get-Item (Join-Path $ocrResourceDir $name) -ErrorAction Stop
            if ($file.Length -le 0) {
              throw "Packaged OCR resource is empty: $name"
            }
          }
          foreach ($name in @('onnxruntime-LICENSE.txt', 'onnxruntime-ThirdPartyNotices.txt')) {
            $file = Get-Item (Join-Path "$ocrResourceDir/licenses" $name) -ErrorAction Stop
            if ($file.Length -le 0) {
              throw "Packaged OCR notice is empty: $name"
            }
          }

          $helper = Get-Item (Join-Path $ocrResourceDir 'manga_ocr_helper.exe')
          $helperBytes = [System.IO.File]::ReadAllBytes($helper.FullName)
          if ($helperBytes.Length -lt 0x46 -or [BitConverter]::ToUInt16($helperBytes, 0) -ne 0x5A4D) {
            throw "$($helper.Name) is not a PE executable"
          }
          $helperPeOffset = [BitConverter]::ToInt32($helperBytes, 0x3C)
          if ($helperPeOffset -lt 0x40 -or $helperPeOffset -gt ($helperBytes.Length - 6)) {
            throw "$($helper.Name) has an invalid PE header offset"
          }
          if ([BitConverter]::ToUInt32($helperBytes, $helperPeOffset) -ne 0x00004550) {
            throw "$($helper.Name) has an invalid PE signature"
          }
          $helperMachine = [BitConverter]::ToUInt16($helperBytes, $helperPeOffset + 4)
          if ($helperMachine -ne 0x8664) {
            throw ('Expected an x64 OCR helper (PE machine 0x8664), found 0x{0:X4}' -f $helperMachine)
          }

          $stderrPath = Join-Path $env:RUNNER_TEMP 'wnacg-ocr-helper-startup.stderr'
          $previousModelsDir = $env:WNACG_OCR_MODELS_DIR
          try {
            $env:WNACG_OCR_MODELS_DIR = Join-Path $env:RUNNER_TEMP 'wnacg-missing-ocr-models'
            $helperProcess = Start-Process -FilePath $helper.FullName -NoNewWindow -Wait -PassThru -RedirectStandardError $stderrPath
            if ($helperProcess.ExitCode -ne 1) {
              throw "OCR helper dependency probe expected exit 1, found $($helperProcess.ExitCode)"
            }
            $helperError = Get-Content $stderrPath -Raw -Encoding UTF8
            if ($helperError -notmatch '无法加载模型') {
              throw "OCR helper did not reach model loading: $helperError"
            }
          } finally {
            if ($null -eq $previousModelsDir) {
              Remove-Item Env:WNACG_OCR_MODELS_DIR -ErrorAction SilentlyContinue
            } else {
              $env:WNACG_OCR_MODELS_DIR = $previousModelsDir
            }
            Remove-Item $stderrPath -Force -ErrorAction SilentlyContinue
          }

          $msiInstaller = $null
          $database = $null
          $view = $null
          try {
            $msiInstaller = New-Object -ComObject WindowsInstaller.Installer
            $database = $msiInstaller.GetType().InvokeMember(
              'OpenDatabase',
              [System.Reflection.BindingFlags]::InvokeMethod,
              $null,
              $msiInstaller,
              @([string] $msis[0].FullName, [int] 0)
            )
            $view = $database.GetType().InvokeMember(
              'OpenView',
              [System.Reflection.BindingFlags]::InvokeMethod,
              $null,
              $database,
              @('SELECT `FileName` FROM `File`')
            )
            [void] $view.GetType().InvokeMember(
              'Execute',
              [System.Reflection.BindingFlags]::InvokeMethod,
              $null,
              $view,
              $null
            )
            $msiFileNames = @()
            while ($true) {
              $record = $view.GetType().InvokeMember(
                'Fetch',
                [System.Reflection.BindingFlags]::InvokeMethod,
                $null,
                $view,
                $null
              )
              if ($null -eq $record) { break }
              try {
                $fileName = $record.GetType().InvokeMember(
                  'StringData',
                  [System.Reflection.BindingFlags]::GetProperty,
                  $null,
                  $record,
                  @([int] 1)
                )
                $msiFileNames += ($fileName -split '\|')[-1]
              } finally {
                if ([Runtime.InteropServices.Marshal]::IsComObject($record)) {
                  [void] [Runtime.InteropServices.Marshal]::FinalReleaseComObject($record)
                }
              }
            }
            foreach ($name in @($ocrFiles + @('onnxruntime-LICENSE.txt', 'onnxruntime-ThirdPartyNotices.txt'))) {
              if ($msiFileNames -notcontains $name) {
                throw "MSI does not contain required OCR resource: $name"
              }
            }
          } finally {
            foreach ($comObject in @($view, $database, $msiInstaller)) {
              if ($null -ne $comObject -and [Runtime.InteropServices.Marshal]::IsComObject($comObject)) {
                [void] [Runtime.InteropServices.Marshal]::FinalReleaseComObject($comObject)
              }
            }
          }

      - name: Upload MSI
        uses: actions/upload-artifact@v7.0.1
        with:
          name: windows-msi
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: Upload NSIS
        uses: actions/upload-artifact@v7.0.1
        with:
          name: windows-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  create-release:
    needs: [quality, build-windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: '*'
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v3.0.2
        with:
          files: |
            *.msi
            *.exe
            *.dmg
          fail_on_unmatched_files: true
