<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/brand/kiri-icon-128.png" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>wnacg · 桌面阅读器</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <main class="shell">
      <aside class="sidebar">
        <div class="brand">
          <img class="brand-mark" src="/brand/kiri-icon-128.png" alt="wnacg" />
          <div>
            <h1>wnacg</h1>
            <p>桌面阅读器</p>
          </div>
        </div>

        <form id="search-form" class="search-panel">
          <label for="search-input">搜索关键词</label>
          <input id="search-input" type="search" placeholder="搜索作品或关键词" autocomplete="off" />
          <button type="submit" class="primary-action">搜索</button>
        </form>

        <div class="title-translate-row">
          <label for="title-translate-toggle" class="title-translate-label">
            <input id="title-translate-toggle" type="checkbox" />
            <span>生肉标题翻译</span>
          </label>
        </div>

        <nav class="shortcut-list" aria-label="分类">
          <h2>分类</h2>
          <div id="category-list"></div>
        </nav>
      </aside>

      <section class="workspace">
        <header class="toolbar">
          <div class="toolbar-left">
            <button id="back-to-list" type="button" class="back-button" hidden></button>
            <div>
              <h2 id="view-title">更新</h2>
              <p id="status-label">就绪</p>
            </div>
          </div>

          <div class="pager" id="pager-controls">
            <button id="refresh" type="button" class="primary-action"></button>
          </div>
        </header>

        <section id="result-grid" class="result-grid" aria-live="polite"></section>
      </section>
    </main>
  </body>
</html>
