[package]
name = "wnacg"
version = "0.1.6"
description = "wnacg desktop app"
edition = "2021"

[lib]
name = "wnacg_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["brotli", "cookies", "deflate", "gzip", "http2", "json", "native-tls", "stream"] }
scraper = "0.23"
urlencoding = "2"
regex-lite = "0.1"
base64 = "0.22"
futures-util = "0.3"
semver = "1"
dirs = "6"
sha2 = "0.10"
tokio = { version = "1", features = ["sync"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"

[profile.release]
strip = true
